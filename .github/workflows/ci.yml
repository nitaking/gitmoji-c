name: Runtime Compatibility

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-bun:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun run test
      - run: ./bin/run --version
      - run: ./bin/run --help

  test-node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: node ./bin/run --version
      - run: node ./bin/run --help

